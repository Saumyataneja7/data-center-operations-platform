name: Generate and Ingest Data Center Telemetry

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZURE_STORAGE_ACCOUNT: dcopsof4ynfphpeqny
  AZURE_STORAGE_CONTAINER: raw
  TELEMETRY_FILE: telemetry_generator/data/generated/telemetry_data.json
  AZURE_BLOB_NAME: telemetry/telemetry_data.json

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r telemetry_generator/requirements.txt

      - name: Generate telemetry data
        run: |
          python telemetry_generator/telemetry_generator.py

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Upload telemetry to ADLS Gen2
        run: |
          python telemetry_generator/upload_to_adls.py